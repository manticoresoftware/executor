name: Publish verified Executor 1.3.100 RPM

on:
  push:
    branches:
      - hotfix/1.3.100-publish

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: "github.event.head_commit.message == 'ci: republish Executor 1.3.100 RPM'"
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm previous 1.4.6 candidate was removed
        shell: bash
        run: |
          set -euo pipefail
          base=https://repo.manticoresearch.com/repository/manticoresearch/release_candidate/centos/9/x86_64
          for package in \
            manticore-executor-1.4.6+26102314.a57785f2-1.el9.x86_64.rpm \
            manticore-extra-1.4.6+26102314.a57785f2-1.el9.noarch.rpm; do
            status=$(curl -sSL --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' "$base/$package")
            echo "$package HTTP $status"
            test "$status" = 404 || { echo "::error::Unexpected candidate package, or cannot verify repository rollback"; exit 1; }
          done

      - name: Download RPM from verified tag build
        uses: actions/download-artifact@v4
        with:
          name: executor-rpm-el9-x86_64
          run-id: 40112843728
          github-token: ${{ github.token }}
          path: dist

      - name: Prepare artifact for repository publisher
        shell: bash
        run: |
          set -euo pipefail
          package=manticore-executor-1.3.100_26102416.d6dbe59f-1.el9.x86_64.rpm
          test -f "dist/$package"
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          mkdir -p packed
          tar -cf packed/artifact.tar -C dist "$package"

      - name: Upload publisher artifact
        uses: actions/upload-artifact@v4
        with:
          name: executor-1.3.100-publisher
          path: packed/artifact.tar
          if-no-files-found: error

      - name: Publish RPM to release_candidate
        uses: manticoresoftware/publish_to_repo@main
        with:
          ssh_key: ${{ secrets.REPO_SSH_KEY }}
          distr: '9'
          arch: x86_64
          artifact: executor-1.3.100-publisher
          type: rpm
          delimiter: '_'
          target: release

      - name: Verify RPM is available in release_candidate
        shell: bash
        run: |
          set -euo pipefail
          url=https://repo.manticoresearch.com/repository/manticoresearch/release_candidate/centos/9/x86_64/manticore-executor-1.3.100_26102416.d6dbe59f-1.el9.x86_64.rpm
          curl -fLsS --retry 5 --retry-delay 3 --max-time 60 --output /tmp/manticore-executor-1.3.100.rpm "$url"
          test -s /tmp/manticore-executor-1.3.100.rpm
          echo "Verified published RPM size: $(wc -c </tmp/manticore-executor-1.3.100.rpm) bytes"

  prerelease:
    if: "github.event.head_commit.message == 'ci: create Executor 1.3.100 prerelease'"
    runs-on: ubuntu-22.04
    steps:
      - name: Download RPM from verified tag build
        uses: actions/download-artifact@v4
        with:
          name: executor-rpm-el9-x86_64
          run-id: 40112843728
          github-token: ${{ github.token }}
          path: dist

      - name: Verify and publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: manticoresoftware/executor
        run: |
          set -euo pipefail
          test -f dist/manticore-executor-1.3.100_26102416.d6dbe59f-1.el9.x86_64.rpm
          gh release create v1.3.100 dist/*.rpm \
            --title 'Manticore Executor 1.3.100' \
            --notes 'Security maintenance: update embedded PHP from 8.4.2 to 8.4.27. AlmaLinux 9 x86_64.' \
            --prerelease
