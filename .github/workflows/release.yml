name: Executor 1.3.100 maintenance

on:
  push:
    branches:
      - hotfix/1.3.100
    tags:
      - v1.3.100

permissions:
  contents: read

jobs:
  rpm-el9-x86_64:
    name: Build and verify RPM on AlmaLinux 9
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile the original Executor with PHP 8.4.27
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain -t executor-maintenance:1.3.100 .
          cid=$(docker create executor-maintenance:1.3.100)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/bin/manticore-executor" ./manticore-executor
          chmod +x ./manticore-executor

      - name: Check version and existing PHP extensions
        shell: bash
        run: |
          set -euo pipefail
          ./manticore-executor --version | tee executor-version.txt
          grep -q '^PHP 8.4.27 ' executor-version.txt
          ./manticore-executor -m | tee executor-modules.txt
          for extension in swoole ds rdkafka simdjson jchash zstd; do
            if ! grep -iq "^$extension$" executor-modules.txt; then
              echo "Required extension missing: $extension"
              exit 1
            fi
          done
          ./manticore-executor -r 'echo "PHP CLI smoke test passed\n";'

      - name: Package EL9 x86_64 RPM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          version="1.3.100_$(date -u +%y%m%d%H).$(git rev-parse --short=8 HEAD)"
          top="$RUNNER_TEMP/rpmbuild"
          source_root="$RUNNER_TEMP/rpm-source"
          mkdir -p "$top/SOURCES" "$top/SPECS" "$source_root/manticore-executor/usr/bin" "$source_root/manticore-executor/usr/share" dist
          cp -p manticore-executor "$source_root/manticore-executor/usr/bin/"
          cp -p README.md "$source_root/manticore-executor/usr/share/manticore-executor-README.md"
          cp -p LICENSE "$source_root/manticore-executor/usr/share/manticore-executor-LICENSE"
          tar -czf "$top/SOURCES/tmp.tar.gz" -C "$source_root" manticore-executor
          sed -e 's/{{ NAME }}/manticore-executor/g' -e "s/{{ VERSION }}/$version/g" \
              -e 's/{{ MAINTAINER }}/Manticore/g' \
              -e 's/{{ DESC }}/Custom built PHP executor for Manticore./g' \
              -e 's/{{ ARCH }}/x86_64/g' packages/main.spec > "$top/SPECS/main.spec"
          rpmbuild -bb --define "_topdir $top" --define 'dist .el9' "$top/SPECS/main.spec"
          cp "$top/RPMS/x86_64/manticore-executor-$version-1.el9.x86_64.rpm" dist/
          rpm -qp --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' dist/*.rpm

      - name: Validate RPM installation in AlmaLinux 9
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/packages:ro" almalinux:9 bash -ec '
            dnf -y install /packages/*.rpm
            manticore-executor --version
            manticore-executor --version | head -n 1 | grep -q "PHP 8.4.27"
            rpm -q manticore-executor
          '

      - name: Upload verified RPM
        uses: actions/upload-artifact@v4
        with:
          name: executor-rpm-el9-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  publish-candidate:
    name: Publish candidate and create prerelease
    if: startsWith(github.ref, 'refs/tags/v1.3.100')
    needs: rpm-el9-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish EL9 RPM to release_candidate
        uses: manticoresoftware/publish_to_repo@main
        with:
          ssh_key: ${{ secrets.REPO_SSH_KEY }}
          distr: '9'
          arch: x86_64
          artifact: executor-rpm-el9-x86_64
          type: rpm
          delimiter: '_'
          target: release

      - name: Download verified RPM for GitHub prerelease
        uses: actions/download-artifact@v4
        with:
          name: executor-rpm-el9-x86_64
          path: dist

      - name: Create versioned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.3.100 dist/*.rpm \
            --title 'Manticore Executor 1.3.100' \
            --notes 'Security maintenance: update embedded PHP from 8.4.2 to 8.4.27.' \
            --prerelease
